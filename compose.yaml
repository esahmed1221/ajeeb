name: ajeeb-storefront

x-app-image: &app-image
  image: ajeeb-storefront:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile

x-postgres-environment: &postgres-environment
  PGHOST: database
  PGPORT: 5432
  PGDATABASE: ${POSTGRES_DB:-ajeeb}
  PGUSER: ${POSTGRES_USER:-ajeeb}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ajeeb}
      POSTGRES_USER: ${POSTGRES_USER:-ajeeb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - backend

  migrate:
    <<: *app-image
    command: ["node", "scripts/migrate-pglite-to-postgres.mjs"]
    environment:
      <<: *postgres-environment
      SOURCE_DATA_DIR: /source-data
    volumes:
      - type: bind
        source: ./data
        target: /source-data
        read_only: true
    tmpfs:
      - /tmp:size=512m
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  app:
    <<: *app-image
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      <<: *postgres-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-${ADMIN_PASSWORD_B64:?Copy .env.example to .env and set ADMIN_PASSWORD}}
      ADMIN_PASSWORD_B64: ${ADMIN_PASSWORD_B64:-}
      SESSION_SECRET: ${SESSION_SECRET:?Copy .env.example to .env and set SESSION_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/data/uploads
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    networks:
      - backend

volumes:
  postgres_data:
  uploads_data:

networks:
  backend:
    driver: bridge
